<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肠道花园 — 页面布局编辑器（可拖拽）</title>
<style>
  :root {
    --forest: #4E6A3E; --cream: #FFF9EF; --coral: #F38D83; --hero: #B06AB3;
    --card-bg: rgba(255,255,255,0.9);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background: #2A2A2A; color: #333; overflow: hidden; height: 100vh;
  }

  /* Top toolbar */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: #1A1A1A; color: #fff; flex-wrap: wrap;
  }
  #toolbar select, #toolbar button {
    padding: 8px 14px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  #toolbar select { background: #333; color: #fff; }
  #toolbar button { background: #444; color: #fff; }
  #toolbar button.active { background: #5A8A3C; }
  #toolbar button.danger { background: #C0392B; }
  #toolbar button.primary { background: #5A8A3C; color: #fff; font-size: 14px; padding: 10px 20px; }
  #toolbar .sep { width: 1px; height: 20px; background: #555; margin: 0 4px; }
  #toolbar label { font-size: 12px; color: #AAA; display: flex; align-items: center; gap: 4px; }
  #toolbar .dirty-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #F38D83; margin-left: 2px; }

  #canvas-wrap {
    margin-top: 52px; height: calc(100vh - 52px); overflow: auto;
    display: flex; align-items: flex-start; justify-content: center; padding: 20px;
    margin-right: 300px;
  }

  #canvas {
    position: relative;
    width: 1280px; min-height: 800px;
    background: var(--cream);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: background 0.3s;
    padding-bottom: 80px;
  }
  #canvas::before {
    content: ''; display: block; height: 28px;
    background: #E8E0D0; border-radius: 20px 20px 0 0;
  }

  /* Blocks */
  .block {
    position: absolute; cursor: default;
    border: 2px solid transparent; border-radius: 10px;
    transition: box-shadow 0.15s;
    background: var(--card-bg);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .block .block-label {
    position: absolute; top: -24px; left: 4px;
    font-size: 11px; font-weight: 700; color: #fff;
    padding: 3px 10px; border-radius: 5px; white-space: nowrap;
    display: none; pointer-events: none;
    background: #333; max-width: 280px; overflow: hidden; text-overflow: ellipsis;
  }
  .block .block-inner {
    width: 100%; height: 100%; overflow: hidden; border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: #555; text-align: center;
    padding: 10px; gap: 6px;
  }
  .block .block-inner .block-icon { font-size: 24px; }
  .block .block-inner .block-name { font-size: 13px; font-weight: 700; line-height: 1.3; }
  .block .block-inner .block-notes-preview { font-size: 10px; color: #999; font-style: italic; line-height: 1.3; max-height: 28px; overflow: hidden; }
  .block .block-inner .block-notes-indicator {
    position: absolute; bottom: 4px; right: 6px;
    font-size: 12px; opacity: 0.7;
  }
  .block .block-handle {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px; border-radius: 4px;
    background: rgba(0,0,0,0.5); color: #fff;
    display: none; align-items: center; justify-content: center;
    font-size: 12px; cursor: grab;
  }
  .block .resize-handle {
    position: absolute; bottom: 0; right: 0;
    width: 14px; height: 14px; border-radius: 0 0 8px 0;
    background: rgba(78,106,62,0.5); cursor: nwse-resize;
    display: none;
  }

  /* Edit mode */
  body.editing .block {
    border-color: rgba(78,106,62,0.4); cursor: move;
  }
  body.editing .block:hover {
    box-shadow: 0 0 0 3px rgba(78,106,62,0.3), 0 8px 24px rgba(0,0,0,0.12);
    z-index: 10;
  }
  body.editing .block .block-label { display: block; }
  body.editing .block .block-handle { display: flex; }
  body.editing .block .resize-handle { display: block; }

  /* Block color codes */
  .block.header-block { background: #E8F0E0; }
  .block.sidebar-block { background: #FEF8F0; }
  .block.main-block { background: #FFF; }
  .block.ai-block { background: #F5F0FA; }
  .block.nav-block { background: #F0EDE4; }
  .block.cta-block { background: #FFF5F5; }
  .block.dock-block { background: #FFF9EF; border: 2px dashed #D0C8B8; border-radius: 12px; }

  .block.dragging { opacity: 0.7; z-index: 100 !important; }

  /* ====== DOCK AREA ====== */
  #dock-area {
    position: absolute; bottom: 8px; left: 16px; right: 16px; height: 66px;
    background: rgba(255,249,239,0.95); backdrop-filter: blur(12px);
    border-top: 1px solid #E8E0D0;
    border-radius: 16px;
    display: flex; align-items: flex-end; justify-content: center; gap: 0;
    padding: 4px 8px 4px 8px; z-index: 60;
  }
  body.editing #dock-area { border: 2px dashed rgba(176,106,179,0.5); }
  .dock-slot {
    flex: 1; max-width: 76px; text-align: center; cursor: pointer;
    padding: 4px 2px 2px 2px; border-radius: 10px; position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    transition: background 0.2s; min-height: 54px;
  }
  body.editing .dock-slot {
    border: 1px dashed rgba(0,0,0,0.12); cursor: move;
  }
  body.editing .dock-slot:hover { background: rgba(176,106,179,0.08); }
  .dock-slot .di { font-size: 20px; pointer-events: none; }
  .dock-slot .dl { font-size: 9px; font-weight: 600; color: #999; pointer-events: none; }
  .dock-slot.active { background: #EDE0F5; }
  .dock-slot.active .dl { color: #B06AB3; }
  .hero-slot {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #B06AB3, #E882A0);
    margin-top: -24px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: #fff; cursor: pointer;
    box-shadow: 0 8px 24px rgba(176,106,179,0.5);
    position: relative;
  }
  body.editing .hero-slot { cursor: move; border: 2px dashed rgba(255,255,255,0.6); }
  .dock-slot .dock-label-tag {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 700; background: #333; color: #fff;
    padding: 2px 6px; border-radius: 3px; white-space: nowrap;
    display: none; pointer-events: none;
  }
  body.editing .dock-slot .dock-label-tag { display: block; }
  .hero-slot .dock-label-tag {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 700; background: #333; color: #fff;
    padding: 2px 6px; border-radius: 3px; white-space: nowrap;
    display: none; pointer-events: none;
  }
  body.editing .hero-slot .dock-label-tag { display: block; }

  /* ====== PROPERTY PANEL ====== */
  #propPanel {
    position: fixed; right: 0; top: 52px; bottom: 0; width: 290px;
    background: #1E1E1E; color: #CCC; z-index: 900;
    padding: 16px; overflow-y: auto; font-size: 13px;
    border-left: 1px solid #333;
    display: flex; flex-direction: column; gap: 12px;
  }
  #propPanel h3 { font-size: 13px; color: #fff; margin: 0; }
  #propPanel .empty-state { color: #666; text-align: center; margin-top: 40px; font-size: 12px; }
  #propPanel label { font-size: 11px; color: #999; display: block; margin-bottom: 4px; font-weight: 600; }
  #propPanel input, #propPanel textarea {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #444;
    background: #2A2A2A; color: #EEE; font-size: 12px; font-family: inherit;
    resize: vertical;
  }
  #propPanel textarea { min-height: 60px; }
  #propPanel input:focus, #propPanel textarea:focus { outline: none; border-color: #5A8A3C; }
  #propPanel .prop-row { display: flex; gap: 6px; }
  #propPanel .prop-row > * { flex: 1; }
  #propPanel .prop-row label { margin-bottom: 2px; }
  #propPanel .btn-row { display: flex; gap: 6px; }
  #propPanel .btn-row button { flex: 1; padding: 6px; border-radius: 6px; border: none; cursor: pointer; font-size: 11px; font-weight: 600; }
  #propPanel .btn-del { background: #5A2020; color: #E88080; }
  #propPanel .btn-del:hover { background: #702828; }
  #propPanel .btn-dup { background: #2A2A40; color: #80A0E0; }
  #propPanel .info-text { font-size: 10px; color: #777; line-height: 1.5; }
  #propPanel .color-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

  /* Toast */
  #prompt-area { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 2000; pointer-events: none; }
  #prompt-toast { background: #1A1A1A; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; box-shadow: 0 8px 30px rgba(0,0,0,0.3); display: none; }

  /* Dock drag ghost */
  .dock-dragging { opacity: 0.4; }
  .dock-drag-over { background: rgba(176,106,179,0.15) !important; border-color: #B06AB3 !important; }

  /* ====== EXPORT MODAL ====== */
  #exportOverlay {
    position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center;
  }
  #exportOverlay.show { display: flex; }
  #exportModal {
    background: #1E1E1E; color: #CCC; border-radius: 16px; padding: 24px;
    width: 700px; max-height: 80vh; display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #exportModal h2 { color: #fff; font-size: 18px; margin: 0; }
  #exportModal .export-tabs { display: flex; gap: 4px; }
  #exportModal .export-tab {
    padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 12px; font-weight: 600; background: #333; color: #999;
  }
  #exportModal .export-tab.active { background: #5A8A3C; color: #fff; }
  #exportModal textarea {
    width: 100%; height: 350px; padding: 12px; border-radius: 8px;
    border: 1px solid #444; background: #2A2A2A; color: #EEE;
    font: 11px/1.5 'Consolas','Courier New',monospace;
    resize: vertical;
  }
  #exportModal .export-actions { display: flex; gap: 8px; justify-content: flex-end; }
  #exportModal .export-actions button {
    padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600;
  }
  #exportModal .btn-copy  { background: #5A8A3C; color: #fff; }
  #exportModal .btn-down  { background: #3A6A8C; color: #fff; }
  #exportModal .btn-close { background: #444; color: #CCC; }
  #exportModal .info-note { font-size: 11px; color: #888; }
  #exportModal code { background: #333; padding: 1px 6px; border-radius: 3px; color: #F38D83; }
</style>
</head>

</div>

<div id="canvas-wrap">
  <div id="canvas"></div>
</div>

<!-- PROPERTY PANEL -->
<div id="propPanel">

  <div id="propContent" style="display:none;display:flex;flex-direction:column;gap:10px;">

      <label>📌 模块名称</label>
      <input type="text" id="propName" placeholder="输入名称...">
    </div>
    <div>
      <label>📝 交互备注</label>
      <textarea id="propNotes" placeholder="例如：滚轮驱动播放、点击弹出子项选择、横向滑动切换、hover触发翻转动画……"></textarea>
    </div>
    <div class="prop-row">
      <div><label>X</label><input type="number" id="propX" step="1"></div>
      <div><label>Y</label><input type="number" id="propY" step="1"></div>
      <div><label>W</label><input type="number" id="propW" step="1" min="40"></div>
      <div><label>H</label><input type="number" id="propH" step="1" min="20"></div>
    </div>
    <div class="prop-row">
      <div><label>Z-Index</label><input type="number" id="propZ" step="1"></div>
      <div style="flex:2;"><span class="info-text">图层顺序，数值越大越靠前，背景设为0</span></div>
    </div>
    <div class="btn-row">
      <button class="btn-dup" id="btnDup">📋 复制模块</button>
      <button class="btn-del" id="btnDel">🗑 删除模块</button>
    </div>
    <div class="info-text" id="propInfo"></div>
    <div id="dockProps" style="display:none;">
      <div style="border-top:1px solid #333;padding-top:10px;margin-top:4px;">
        <label>🔗 导航链接 (路由)</label>
        <input type="text" id="propRoute" placeholder="例如: /garden">
        <div class="info-text" style="margin-top:4px;">Hero按钮没有路由，点击时弹出便便记录弹窗</div>
      </div>
    </div>
  </div>
</div>

<!-- EXPORT MODAL -->
<div id="exportOverlay">
  <div id="exportModal">
    <h2>📦 导出布局数据</h2>
    <div class="export-tabs" id="exportTabs"></div>
    <textarea id="exportText" readonly spellcheck="false"></textarea>
    <div class="export-actions">
      <button class="btn-close" id="btnExportClose">关闭</button>
      <button class="btn-down" id="btnDownload">💾 下载 JSON 文件</button>
      <button class="btn-copy" id="btnCopy">📋 复制到剪贴板</button>
    </div>
    <div class="info-note">

    </div>
  </div>
</div>

<div id="prompt-area"><div id="prompt-toast"></div></div>

// ============ STATE ============
let currentPage = 'home';
let blocks = [];
let dockTabs = [];
let editing = true;
let selectedBlockId = null;
let showGrid = true;

// Working copy persists edits across page switches
let workingPages = {};
function initWorkingPages() {
  for (const [key, def] of Object.entries(pageDefs)) {
    workingPages[key] = {
      blocks: def.blocks.map(b => ({...b, notes: b.notes || ''})),
      dockTabs: (def.dockTabs || pageDefs.home.dockTabs).map(d => ({...d, notes: d.notes || ''})),
    };
  }
}
initWorkingPages();

const canvas = document.getElementById('canvas');

// ============ DIRTY TRACKING ============
function isPageDirty(pageName) {
  const def = pageDefs[pageName];
  const wp = workingPages[pageName];
  if (!wp) return false;
  return JSON.stringify(wp.blocks) !== JSON.stringify(def.blocks.map(b => ({...b, notes: b.notes || ''}))) ||
         JSON.stringify(wp.dockTabs) !== JSON.stringify((def.dockTabs || pageDefs.home.dockTabs).map(d => ({...d, notes: d.notes || ''})));
}

function updateDirtyIndicator() {
  const sel = document.getElementById('pageSelect');
  for (const opt of sel.options) {
    if (isPageDirty(opt.value)) {
      if (!opt.textContent.includes(' *')) opt.textContent = opt.textContent.replace(' *', '') + ' *';
    } else {
      opt.textContent = opt.textContent.replace(' *', '');
    }
  }
}

// ============ PROPERTY PANEL ============
function showPropPanel(kind, id) {
  const empty = document.getElementById('propEmpty');
  const content = document.getElementById('propContent');
  const dockProps = document.getElementById('dockProps');
  const info = document.getElementById('propInfo');

  if (!id) {
    empty.style.display = 'block';
    content.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  content.style.display = 'flex';

  if (kind === 'block') {
    const b = blocks.find(bb => bb.id === id);
    if (!b) return;
    document.getElementById('propName').value = b.label;
    document.getElementById('propNotes').value = b.notes || '';
    document.getElementById('propX').value = Math.round(b.x);
    document.getElementById('propY').value = Math.round(b.y);
    document.getElementById('propW').value = Math.round(b.w);
    document.getElementById('propH').value = Math.round(b.h);
    document.getElementById("propZ").value = b.z || 0;
    info.textContent = 'ID: ' + b.id + ' | 颜色: ' + (b.color || 'main-block');
    dockProps.style.display = 'none';
    document.getElementById('btnDup').style.display = '';
    document.getElementById('btnDel').style.display = '';
  } else if (kind === 'dock') {
    const d = dockTabs.find(dd => dd.id === id);
    if (!d) return;
    document.getElementById('propName').value = d.label;
    document.getElementById('propNotes').value = d.notes || '';
    document.getElementById('propX').value = '';
    document.getElementById('propY').value = '';
    document.getElementById('propW').value = '';
    document.getElementById('propH').value = '';
    info.textContent = '导航栏 Tab | 类型: ' + (d.hero ? 'Hero CTA 凸起按钮' : '普通 Tab');
    dockProps.style.display = 'block';
    document.getElementById('propRoute').value = d.route || '';
    document.getElementById('btnDup').style.display = 'none';
    document.getElementById('btnDel').style.display = d.hero ? 'none' : '';
  }
}

function hidePropPanel() {
  document.getElementById('propEmpty').style.display = 'block';
  document.getElementById('propContent').style.display = 'none';
}

// Prop panel input bindings
document.getElementById('propName').addEventListener('input', function() {

document.getElementById('propNotes').addEventListener('input', function() {
  if (!selectedBlockId) return;
  if (selectedBlockId.startsWith('dock_')) {
    const d = dockTabs.find(dd => dd.id === selectedBlockId);
    if (d) { d.notes = this.value; updateDockNotes(selectedBlockId); }
  } else {
    const b = blocks.find(bb => bb.id === selectedBlockId);

});

document.getElementById('btnDel').addEventListener('click', () => {

    const d = dockTabs.find(dd => dd.id === selectedBlockId);

document.getElementById('btnDup').addEventListener('click', () => {

function markDirty() {
  updateDirtyIndicator();
}

// ============ RENDER ============
function renderPage(pageName, forceReset) {
  // Save current page edits before switching
  if (currentPage && workingPages[currentPage] && !forceReset && blocks.length > 0) {
    workingPages[currentPage].blocks = blocks.map(b => ({...b}));
    workingPages[currentPage].dockTabs = dockTabs.map(d => ({...d}));
  }

  currentPage = pageName;
  const wp = workingPages[pageName];
  blocks = wp.blocks.map(b => ({...b, notes: b.notes || ''}));
  dockTabs = wp.dockTabs.map(d => ({...d, notes: d.notes || ''}));

  // Clear
  canvas.querySelectorAll('.block, #dock-area').forEach(el => el.remove());
  selectedBlockId = null;
  hidePropPanel();
  clearAllSelections();

  // Render
  blocks.forEach(b => createBlockElement(b));
  renderDock();

  document.body.classList.toggle('editing', editing);
  document.getElementById('pageSelect').value = pageName;
  document.getElementById('btnEdit').classList.toggle('active', editing);

  updateDirtyIndicator();
}

function createBlockElement(b) {
  const el = document.createElement('div');
  el.className = 'block ' + (b.color || '');
  el.id = 'block-' + b.id;
  el.style.left = b.x + 'px';
  el.style.top = b.y + 'px';
  el.style.width = b.w + 'px';
  el.style.height = b.h + 'px';
  el.style.zIndex = b.z || 0;
  el.dataset.blockId = b.id;
  el.innerHTML = `
    <div class="block-label">${escHtml(b.label)}</div>
    <div class="block-inner">
      <div class="block-icon">${b.icon || ''}</div>
      <div class="block-name">${escHtml(b.label)}</div>
      ${b.notes ? `<div class="block-notes-preview">${escHtml(b.notes.split('\n')[0])}</div>` : ''}
      ${b.notes ? `<div class="block-notes-indicator">📝</div>` : ''}
    </div>
    <div class="block-handle">⋮⋮</div>
    <div class="resize-handle"></div>
  `;
  canvas.appendChild(el);

  makeDraggable(el);
  makeResizable(el);

  el.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('resize-handle')) return;
    selectBlock(b.id);
  });

  el.addEventListener('dblclick', (e) => {
    const newLabel = prompt('模块名称:', b.label);
    if (newLabel !== null) {
      b.label = newLabel;
      updateBlockLabel(b.id);
      if (selectedBlockId === b.id) {
        document.getElementById('propName').value = newLabel;
      }
      markDirty();
    }
  });
}

function updateBlockLabel(id) {
  const b = blocks.find(bb => bb.id === id);
  const el = document.getElementById('block-' + id);
  if (!b || !el) return;
  el.querySelector('.block-label').textContent = b.label;
  el.querySelector('.block-name').textContent = b.label;
}

function updateBlockNotes(id) {
  const b = blocks.find(bb => bb.id === id);
  const el = document.getElementById('block-' + id);
  if (!b || !el) return;
  const preview = el.querySelector('.block-notes-preview');
  const indicator = el.querySelector('.block-notes-indicator');
  if (b.notes) {
    if (!preview) {
      const p = document.createElement('div');
      p.className = 'block-notes-preview';
      el.querySelector('.block-inner').appendChild(p);
    }
    el.querySelector('.block-notes-preview').textContent = b.notes.split('\n')[0];
    if (!indicator) {
      const ind = document.createElement('div');
      ind.className = 'block-notes-indicator';
      ind.textContent = '📝';
      el.querySelector('.block-inner').appendChild(ind);
    }
  } else {
    if (preview) preview.remove();
    if (indicator) indicator.remove();
  }
}

function updateDockLabel(id) {
  const slot = document.getElementById('slot-' + id);
  if (!slot) return;
  const labelEl = slot.querySelector('.dl');
  const tagEl = slot.querySelector('.dock-label-tag');
  const d = dockTabs.find(dd => dd.id === id);
  if (!d) return;
  if (labelEl) labelEl.textContent = d.label;
  if (tagEl) tagEl.textContent = d.label;
}

function updateDockNotes(id) {
  // Notes for dock items are stored but shown in property panel only
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ============ DOCK ============
function renderDock() {
  let dock = document.getElementById('dock-area');
  if (dock) dock.remove();

  dock = document.createElement('div');
  dock.id = 'dock-area';
  canvas.appendChild(dock);

  dockTabs.forEach((d, idx) => {
    if (d.hero) {
      const hero = document.createElement('div');
      hero.className = 'hero-slot';
      hero.id = 'slot-' + d.id;
      hero.dataset.dockId = d.id;
      hero.innerHTML = `<span class="dock-label-tag">${escHtml(d.label)}</span>${d.icon}`;
      hero.title = d.notes || d.label;
      dock.appendChild(hero);
      makeDockDraggable(hero, idx);
      hero.addEventListener('mousedown', (e) => { e.stopPropagation(); selectDock(d.id); });
      hero.addEventListener('dblclick', (e) => {
        const newLabel = prompt('Hero 按钮名称:', d.label);
        if (newLabel !== null) { d.label = newLabel; updateDockLabel(d.id); markDirty(); }
      });
    } else {
      const slot = document.createElement('div');
      slot.className = 'dock-slot';
      if (d.route && currentPage === d.route.replace('/','') || (d.route === '/' && currentPage === 'home')) {
        slot.classList.add('active');
      }
      slot.id = 'slot-' + d.id;
      slot.dataset.dockId = d.id;
      slot.innerHTML = `
        <span class="dock-label-tag">${escHtml(d.label)}</span>
        <span class="di">${d.icon}</span>
        <span class="dl">${escHtml(d.label)}</span>
      `;
      slot.title = d.notes || '';
      dock.appendChild(slot);
      makeDockDraggable(slot, idx);
      slot.addEventListener('mousedown', (e) => { e.stopPropagation(); selectDock(d.id); });
      slot.addEventListener('dblclick', (e) => {
        const newLabel = prompt('Tab 名称:', d.label);
        if (newLabel !== null) { d.label = newLabel; updateDockLabel(d.id); markDirty(); }
      });
    }
  });
}

function makeDockDraggable(el, origIdx) {
  if (!editing) return;
  el.draggable = true;
  el.addEventListener('dragstart', (e) => {
    if (!editing) { e.preventDefault(); return; }
    el.classList.add('dock-dragging');
    e.dataTransfer.setData('text/plain', el.dataset.dockId);
    e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragend', () => { el.classList.remove('dock-dragging'); });
  el.addEventListener('dragover', (e) => {
    if (!editing) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    el.classList.add('dock-drag-over');
  });
  el.addEventListener('dragleave', () => { el.classList.remove('dock-drag-over'); });
  el.addEventListener('drop', (e) => {
    if (!editing) return;
    e.preventDefault();
    el.classList.remove('dock-drag-over');
    const fromId = e.dataTransfer.getData('text/plain');
    const toId = el.dataset.dockId;
    if (fromId === toId) return;
    const fromIdx = dockTabs.findIndex(d => d.id === fromId);
    const toIdx = dockTabs.findIndex(d => d.id === toId);
    if (fromIdx < 0 || toIdx < 0) return;
    if (dockTabs[fromIdx].hero || dockTabs[toIdx].hero) return;
    const [moved] = dockTabs.splice(fromIdx, 1);
    dockTabs.splice(toIdx, 0, moved);
    renderDock();
    markDirty();
    toast('🔀 导航Tab顺序已调整');
  });
}

function selectBlock(id) {

  const el = document.getElementById('block-' + id);

// ============ DRAG & DROP (Blocks) ============
let dragState = null;

function makeDraggable(el) {
  el.addEventListener('mousedown', (e) => {
    if (!editing) return;
    if (e.target.classList.contains('resize-handle')) return;
    if (e.button !== 0) return;
    const blockId = el.dataset.blockId;
    const block = blocks.find(b => b.id === blockId);
    if (!block) return;
    dragState = { blockId, startX: e.clientX, startY: e.clientY, origX: block.x, origY: block.y, el };
    el.classList.add('dragging');
    selectBlock(blockId);
    e.preventDefault();
  });
}

function makeResizable(el) {
  el.querySelector('.resize-handle').addEventListener('mousedown', (e) => {
    if (!editing) return;
    const blockId = el.dataset.blockId;
    const block = blocks.find(b => b.id === blockId);
    if (!block) return;
    dragState = { blockId, startX: e.clientX, startY: e.clientY, origW: block.w, origH: block.h, el, resize: true };
    e.preventDefault();
    e.stopPropagation();
  });
}

document.addEventListener('mousemove', (e) => {
  if (!dragState) return;
  if (dragState.resize) {
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    const block = blocks.find(b => b.id === dragState.blockId);
    if (block) {
      block.w = Math.max(40, dragState.origW + dx);
      block.h = Math.max(20, dragState.origH + dy);
      dragState.el.style.width = block.w + 'px';
      dragState.el.style.height = block.h + 'px';
      if (selectedBlockId === block.id) {
        document.getElementById('propW').value = Math.round(block.w);
        document.getElementById('propH').value = Math.round(block.h);
      }
    }
  } else {
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    const block = blocks.find(b => b.id === dragState.blockId);
    if (block) {
      block.x = Math.max(0, dragState.origX + dx);
      block.y = Math.max(30, dragState.origY + dy);
      dragState.el.style.left = block.x + 'px';
      dragState.el.style.top = block.y + 'px';
      if (selectedBlockId === block.id) {
        document.getElementById('propX').value = Math.round(block.x);
        document.getElementById('propY').value = Math.round(block.y);
      }
    }
  }
});

document.addEventListener('mouseup', () => {
  if (dragState) {
    if (dragState.el) dragState.el.classList.remove('dragging');
    dragState = null;
    markDirty();
  }
});


document.getElementById('propZ').addEventListener('input', function() {

  const b = blocks.find(bb => bb.id === selectedBlockId);

// ============ EXPORT ============
function getExportData(pageName) {
  const wp = workingPages[pageName];
  if (!wp) return null;
  return {
    page: pageName,
    title: pageDefs[pageName].title,
    blocks: wp.blocks.map(b => ({
      id: b.id, x: Math.round(b.x), y: Math.round(b.y),
      w: Math.round(b.w), h: Math.round(b.h),
      label: b.label, icon: b.icon, notes: b.notes, z: b.z || 0, color: b.color,
    })),
    dockTabs: wp.dockTabs.map(d => ({
      id: d.id, icon: d.icon, label: d.label, route: d.route, hero: d.hero, notes: d.notes,
    })),
  };
}

function getAllExportData() {
  const all = {};
  for (const key of Object.keys(pageDefs)) {
    all[key] = getExportData(key);
  }
  return all;
}

function showExportModal(singlePage) {
  const overlay = document.getElementById('exportOverlay');
  const textarea = document.getElementById('exportText');
  const tabs = document.getElementById('exportTabs');

  let activeTab = singlePage || 'home';

  function renderTabs() {
    tabs.innerHTML = '';
    if (singlePage) {
      // Single page: just show the one tab
      const btn = document.createElement('button');
      btn.className = 'export-tab active';
      btn.textContent = pageDefs[singlePage].title;
      tabs.appendChild(btn);
    } else {
      // All pages: show tabs for each
      for (const key of Object.keys(pageDefs)) {
        const btn = document.createElement('button');
        btn.className = 'export-tab' + (key === activeTab ? ' active' : '');
        btn.textContent = pageDefs[key].title;
        btn.addEventListener('click', () => {
          activeTab = key;
          textarea.value = JSON.stringify(getExportData(key), null, 2);
          renderTabs();
        });
        tabs.appendChild(btn);
      }
    }
  }

  function updateText() {
    if (singlePage) {
      textarea.value = JSON.stringify(getExportData(singlePage), null, 2);
    } else {
      textarea.value = JSON.stringify(getExportData(activeTab), null, 2);
    }
  }

  renderTabs();
  updateText();

  // Copy button
  document.getElementById('btnCopy').onclick = () => {
    const data = singlePage ? JSON.stringify(getExportData(singlePage), null, 2) : JSON.stringify(getAllExportData(), null, 2);
    navigator.clipboard.writeText(data).then(() => {
      toast('✅ 已复制到剪贴板！');
    }).catch(() => {
      textarea.select();
      toast('⚠️ 请手动 Ctrl+C 复制');
    });
  };

  // Download button
  document.getElementById('btnDownload').onclick = () => {
    let data, filename;
    if (singlePage) {
      data = JSON.stringify(getExportData(singlePage), null, 2);
      filename = 'gut-garden_layout_' + singlePage + '.json';
    } else {
      data = JSON.stringify(getAllExportData(), null, 2);
      filename = 'gut-garden_layout_all_pages.json';
    }
    const blob = new Blob([data], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    toast('✅ 已下载: ' + filename);
  };

  // Close button
  document.getElementById('btnExportClose').onclick = () => {
    overlay.classList.remove('show');
  };

  overlay.classList.add('show');
}
